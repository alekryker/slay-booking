<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{font-family:Kanit;background:#111;color:#fff;text-align:center}
.table{cursor:pointer}
.booked circle{fill:red}
</style>
</head>

<body>

<h2>SLAY ROI-ET</h2>
<input type="date" id="date">

<svg viewBox="0 0 400 400"></svg>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwaw0TtgEZe-1Hwz1dyysHkz10nU09bvVCwIcDHpXO_-D1ZpsBC4hGL5muoYerQAc_Ihw/exec";
const LIFF_ID = "2009168820-FDQ4rPc8";

let USER_ID = "";
let selectedTable = null;

async function init(){

  await liff.init({ liffId: LIFF_ID });

  if(!liff.isLoggedIn()){
    liff.login();
    return;
  }

  const profile = await liff.getProfile();
  USER_ID = profile.userId;

  loadTables();
}

init();

const tables = {
  A1:[100,100],
  A2:[200,100],
  A3:[300,100]
};

function loadTables(){

  const svg = document.querySelector("svg");

  Object.keys(tables).forEach(id => {

    const [x,y] = tables[id];

    const g = document.createElementNS("http://www.w3.org/2000/svg","g");

    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x);
    c.setAttribute("cy",y);
    c.setAttribute("r",30);

    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",x);
    t.setAttribute("y",y+5);
    t.textContent = id;

    g.appendChild(c);
    g.appendChild(t);

    g.onclick = () => openBooking(id);

    svg.appendChild(g);
  });
}

function openBooking(table){

  selectedTable = table;

  Swal.fire({
    title:"จองโต๊ะ " + table,
    html:`
      <input id="name" placeholder="ชื่อ"><br>
      <input id="slay" placeholder="จำนวน"><br>
      <input id="phone" placeholder="เบอร์">
    `,
    preConfirm: () => {

      return {
        name: document.getElementById("name").value,
        slay: document.getElementById("slay").value,
        phone: document.getElementById("phone").value
      }
    }
  }).then(async (res)=>{

    if(!res.isConfirmed) return;

    const data = res.value;

    const payload = {
      action:"reserve",
      userId: USER_ID,
      table: selectedTable,
      date: document.getElementById("date").value,
      ...data
    };

    const r = await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify(payload)
    });

    const result = await r.json();

    if(result.status==="taken"){
      Swal.fire("โต๊ะถูกจองแล้ว");
      return;
    }

    Swal.fire("จองสำเร็จ 🎉");

  });
}

</script>
</body>
</html>
